plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.96' // check https://maven.neoforged.net if newer exists
}

version = '1.0.0'
group = 'com.tristankechlo.toolleveling'
archivesBaseName = 'toolleveling'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // Use Mojang's official mappings
    mappings channel: 'official', version: '1.20.4'
}

dependencies {
    implementation 'net.neoforged:neoforge:20.4.169' // or the latest version for 1.20.4
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "ToolLeveling",
            "Specification-Vendor"    : "tristankechlo",
            "Specification-Version"   : "1",
            "Implementation-Title"    : "ToolLeveling",
            "Implementation-Version"  : version,
            "Implementation-Vendor"   : "tristankechlo",
            "Mod-Id"                  : "toolleveling"
        ])
    }
}
